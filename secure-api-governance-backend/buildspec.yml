version: 0.2

phases:
  install:
    runtime-versions:
      java: corretto21

  pre_build:
    commands:
      - echo "Starting Maven build..."
      - cd secure-api-governance-backend
      - java -version
      - mvn -version

  build:
    commands:
      - cd secure-api-governance-backend
      - echo "Building Spring Boot application..."
      - mvn clean package

  post_build:
    commands:
      - echo "Build completed successfully"

artifacts:
  files:
    - secure-api-governance-backend/target/*.jar
