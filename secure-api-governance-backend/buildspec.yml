version: 0.2

phases:
  install:
    runtime-versions:
      java: corretto21

  pre_build:
    commands:
      - echo "Starting Maven build..."
      - java -version
      - mvn -version

  build:
    commands:
      - echo "Building Spring Boot application..."
      - mvn -f secure-api-governance-backend/pom.xml clean package -DskipTests

  post_build:
    commands:
      - echo "Build completed successfully"

artifacts:
  files:
    - secure-api-governance-backend/target/*.jar
