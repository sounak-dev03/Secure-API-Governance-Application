version: 0.2

phases:
  install:
    runtime-versions:
      java: corretto21

  pre_build:
    commands:
      - echo "Starting Maven build..."
      - java -version
      - mvn -version

  build:
    commands:
      - echo "Building application..."
      - mvn clean package

  post_build:
    commands:
      - echo "Build completed successfully"

artifacts:
  files:
    - target/*.jar
